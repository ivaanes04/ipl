<script>
// Embed mode for other sites (pcmmulti.com): https://iplmulti.pages.dev/?embed#races
// hides the top bar, uses ?theme=light|dark (default light) and tells the parent page its height and where to scroll.
(() => { try {
  const q = new URLSearchParams(location.search);
  if (!q.has('embed')) return;
  window.IPL_EMBED = true;
  const r = document.documentElement; r.classList.add('embed');
  r.dataset.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
} catch (e) {} })();
</script>

<style>
/* Layout: a race-office results site. Sticky dark top bar, content column up to 1200px; home is a 12-column grid of panels. */
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #17191e; --muted: #656a74; --line: #e1dfd8; --soft: #efede7;
  --accent: #d0142c; --accent-ink: #ffffff; --bar: #17191e; --bar-ink: #f4f3ef;
  --gc: #f2c200; --pts: #2f9e44; --kom: #d7263d; --young: #ffffff; --team: #3a5a9b;
  --ok: #2f7d3b; --bad: #b42318;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;

  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121418; --panel: #1b1e24; --ink: #ebeae6; --muted: #9ba0aa; --line: #2c3038; --soft: #23272e;
  --accent: #ff4d60; --accent-ink: #121418; --bar: #0b0c0f; --bar-ink: #ebeae6; --young: #ebeae6; --team: #7d9be0; --ok: #6cc77a; --bad: #ff7a6b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121418; --panel: #1b1e24; --ink: #ebeae6; --muted: #9ba0aa; --line: #2c3038; --soft: #23272e;
  --accent: #ff4d60; --accent-ink: #121418; --bar: #0b0c0f; --bar-ink: #ebeae6; --young: #ebeae6; --team: #7d9be0; --ok: #6cc77a; --bad: #ff7a6b; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
a { color: inherit; text-decoration: none; }

.num, td.n, th.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); }
.top-in, .wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 20px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; display: flex; align-items: center; gap: 9px; }

.nav { display: flex; gap: 2px; flex-wrap: wrap; }

@media (max-width: 700px) {
  .top { position: static; }

}
.gsearch { position: relative; margin-left: auto; flex: 0 1 260px; min-width: 0; }

.gsearch input[type=search] { width: 100%; height: 36px; padding: 0 12px 0 34px; border-radius: 999px; border: 1px solid rgb(127 127 127 / .35); background: rgb(255 255 255 / .08); color: inherit; font: inherit; font-size: 14px; }

.gs-list { position: absolute; right: 0; top: calc(100% + 6px); width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgb(0 0 0 / .25); padding: 6px; z-index: 20; }

@media (max-width: 920px) { .c8, .c4, .c6 { grid-column: span 12; } }

/* wide stats table: keep the rider column in view while scrolling sideways on a phone */
@media (max-width: 860px) { .stt td.rider, .stt th:nth-child(2) { position: sticky; left: 0; z-index: 1; background: var(--panel, var(--bg)); } }

  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 55%), linear-gradient(135deg, #191c22, #0d0f13); box-shadow: 0 10px 30px rgb(0 0 0 / .18); }

/* stage profile types (PCS-style p1-p5) */

// ---------- global search (top bar): riders, teams, managers, races ----------
function setupSearch() {
  const input = document.getElementById('gq'), list = document.getElementById('gsList');
  if (!input) return;
  const fold = (s) => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const items = [];
  for (const [i, o] of IX.rider) if (rid(i)) items.push({ k: 'Rider', name: rid(i), sub: [...o.teams].filter((t) => tid(t)).map(tid)[0] || '', href: '#rider-' + i, pts: o.pts, rider: i });
  for (const [ti, q] of IX.squad || new Map()) items.push({ k: 'Team', name: tid(ti), sub: [...q.mgrs].map(teamOf).filter((v, k, a) => a.indexOf(v) === k).join(', '), href: '#squad-' + ti, pts: 500 + q.wins, squad: ti });
  for (const [n, id] of IX.teamIds) items.push({ k: 'Manager', name: n, sub: 'Season 1', href: '#team-' + id, pts: 600 });
  S.s1.races.forEach((r, i) => items.push({ k: 'Race', name: r.name, sub: 'Season 1 · ' + (r.stages > 1 ? r.stages + ' stages' : 'one-day'), href: '#race-' + i, pts: 700 }));
  for (const t of (S.s2signups && S.s2signups.teams) || []) items.push({ k: 'Team', name: t.team, sub: 'Season 2 · ' + s2Name(t), href: '#s2teams', pts: 520, jersey: t.jersey ? 'img/jerseys/' + t.jersey + '.png' : null });
  IX.s2.forEach((r, i) => items.push({ k: 'Race', name: r.race, sub: 'Season 2 · ' + fdate(r.date), href: '#s2race-' + i, pts: 650 }));
  items.forEach((it) => { it.f = fold(it.name + ' ' + it.sub); it.fn = fold(it.name); });
  let shown = [], sel = 0;
  const icon = (it) => {
    if (it.k === 'Rider') { const p = S.photos ? S.photos[it.name] : (S.photoIndex || {})[it.name] && 'img/r/' + S.photoIndex[it.name]; return h('span', { class: 'gs-ic' }, p ? h('img', { src: p, alt: '', loading: 'lazy' }) : 'R'); }
    if (it.k === 'Team') { const j = it.jersey || jerseyOf(it.name); return h('span', { class: 'gs-ic jsy' }, j ? h('img', { src: j, alt: '' }) : 'T'); }
    return h('span', { class: 'gs-ic' }, it.k === 'Race' ? '🏁' : 'M');
  };
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); };
  const go = (it) => { if (!it) return; close(); input.value = ''; input.blur(); location.hash = it.href; };
  const draw = () => {
    const q = fold(input.value.trim());
    if (q.length < 2) { close(); return; }
    const words = q.split(/\s+/);
    shown = items.filter((it) => words.every((w) => it.f.includes(w)))
      .sort((a, b) => (b.fn.startsWith(q) - a.fn.startsWith(q)) || (b.fn.split(/\s+/).some((w) => w.startsWith(words[0])) - a.fn.split(/\s+/).some((w) => w.startsWith(words[0]))) || b.pts - a.pts)
      .slice(0, 9);
    sel = 0;
    list.replaceChildren(...(shown.length ? shown.map((it, k) => h('a', { class: 'gs-it', href: it.href, role: 'option', 'aria-selected': String(k === sel), onclick: (e) => { e.preventDefault(); go(it); } }, icon(it), h('span', null, h('b', null, it.name), it.sub ? h('small', null, it.sub) : null), h('span', { class: 'gs-k' }, it.k)))
      : [h('div', { class: 'gs-none' }, 'Nothing found for “' + input.value.trim() + '”')]));
    list.hidden = false; input.setAttribute('aria-expanded', 'true');
  };
  const mark = () => [...list.children].forEach((c, k) => c.setAttribute && c.setAttribute('aria-selected', String(k === sel)));
  input.addEventListener('input', draw);
  input.addEventListener('focus', () => { if (input.value.trim().length >= 2) draw(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && shown.length) { sel = (sel + 1) % shown.length; mark(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' && shown.length) { sel = (sel - 1 + shown.length) % shown.length; mark(); e.preventDefault(); }
    else if (e.key === 'Enter') { go(shown[sel]); e.preventDefault(); }
    else if (e.key === 'Escape') { close(); input.blur(); }
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.gsearch')) close(); });
  // "/" jumps to the search box from anywhere
  document.addEventListener('keydown', (e) => { if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); } });
}
